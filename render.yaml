services:
  - type: web
    name: marketmind-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.commands.seed_demo && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: INITIAL_ADMIN_EMAIL
        value: admin@system.com
      - key: INITIAL_ADMIN_PASSWORD
        value: admin123
